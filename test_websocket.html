<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 测试 - Nanobot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #00d9ff;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-left: 10px;
        }

        .status.connected {
            background: #00c853;
            color: white;
        }

        .status.disconnected {
            background: #ff5252;
            color: white;
        }

        .status.connecting {
            background: #ffc107;
            color: #333;
        }

        .config-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }

        .form-group {
            display: grid;
            grid-template-columns: 120px 1fr 100px;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-group label {
            color: #aaa;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"] {
            padding: 10px 15px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            font-size: 0.95rem;
            width: 100%;
        }

        input:focus {
            outline: none;
            border-color: #00d9ff;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #00d9ff;
            color: #1a1a2e;
        }

        .btn-primary:hover {
            background: #00b8cc;
        }

        .btn-secondary {
            background: #444;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #555;
        }

        .btn-danger {
            background: #ff5252;
            color: white;
        }

        .btn-danger:hover {
            background: #ff1744;
        }

        .btn-send {
            background: linear-gradient(135deg, #00d9ff, #0099cc);
            color: #1a1a2e;
            padding: 12px 30px;
            font-size: 1rem;
        }

        .chat-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (min-width: 768px) {
            .chat-container {
                grid-template-columns: 300px 1fr;
            }
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 1rem;
            color: #00d9ff;
            margin-bottom: 15px;
        }

        .log-entry {
            font-family: 'Consolas', monospace;
            font-size: 0.8rem;
            padding: 5px 0;
            border-bottom: 1px solid #333;
            color: #aaa;
        }

        .log-entry .time {
            color: #666;
        }

        .log-entry.sent {
            color: #69f0ae;
        }

        .log-entry.received {
            color: #40c4ff;
        }

        .log-entry.error {
            color: #ff5252;
        }

        .log-entry.info {
            color: #ffd740;
        }

        .chat-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-height: 400px;
            min-height: 300px;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            text-align: right;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #00d9ff, #0099cc);
            color: #1a1a2e;
        }

        .message.assistant .bubble {
            background: #333;
            color: #eee;
        }

        .message.system .bubble {
            background: transparent;
            color: #aaa;
            text-align: center;
            font-size: 0.85rem;
            border: 1px dashed #444;
        }

        .message.error .bubble {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
            border: 1px solid #ff5252;
        }

        .message.thinking .bubble {
            background: rgba(103, 58, 183, 0.2);
            color: #b388ff;
            border: 1px solid #7c4dff;
            font-style: italic;
        }

        .message.tool_call .bubble {
            background: rgba(255, 193, 7, 0.15);
            color: #ffd54f;
            border: 1px solid #ffc107;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
        }

        .message.tool_result .bubble {
            background: rgba(76, 175, 80, 0.15);
            color: #81c784;
            border: 1px solid #4caf50;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
        }

        .message.streaming .bubble {
            border-left: 3px solid #00d9ff;
        }

        .message.streaming .bubble::after {
            content: '▋';
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .tool-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        .bubble {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .bubble pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 8px;
        }

        .bubble code {
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
        }

        .input-area {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            border: 1px solid #444;
            border-radius: 25px;
            padding: 12px 20px;
            background: #1a1a2e;
            color: #fff;
            font-size: 1rem;
        }

        .input-area input:focus {
            outline: none;
            border-color: #00d9ff;
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.1);
        }

        .quick-btn {
            padding: 6px 12px;
            background: #333;
            border: 1px solid #444;
            border-radius: 15px;
            color: #aaa;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #444;
            color: #fff;
            border-color: #00d9ff;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Nanobot WebSocket 测试</h1>
            <span class="status disconnected" id="status">未连接</span>
        </div>

        <div class="config-panel">
            <div class="form-group">
                <label>服务器地址</label>
                <input type="text" id="host" value="localhost" placeholder="localhost">
                <span style="color: #666; font-size: 0.8rem;">:端口</span>
            </div>
            <div class="form-group">
                <label>端口</label>
                <input type="number" id="port" value="8765" placeholder="8765">
                <span style="color: #666; font-size: 0.8rem;">WebSocket</span>
            </div>
            <div class="form-group">
                <label>用户ID</label>
                <input type="text" id="userId" value="test_user" placeholder="user_001">
            </div>
            <div class="form-group">
                <label>认证Token</label>
                <input type="password" id="token" placeholder="可选，如果需要认证">
            </div>
            <div class="form-group">
                <label></label>
                <label style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="showThinking" checked style="width: auto;" onchange="sendPreferences()">
                    显示思考过程
                </label>
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <button class="btn-primary" id="connectBtn" onclick="connect()">连接</button>
                <button class="btn-danger" id="disconnectBtn" onclick="disconnect()" style="display: none;">断开</button>
            </div>
        </div>

        <div class="chat-container">
            <div class="sidebar">
                <h3>📋 事件日志</h3>
                <div id="logs"></div>
            </div>
            <div class="chat-area">
                <div class="messages" id="messages">
                    <div class="message system">
                        <div class="bubble">配置服务器地址和用户ID，然后点击"连接"按钮开始</div>
                    </div>
                </div>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="sendQuick('你好！')">👋 你好</button>
                    <button class="quick-btn" onclick="sendQuick('当前工作空间有哪些文件？')">📁 列出文件</button>
                    <button class="quick-btn" onclick="sendQuick('读取 MEMORY.md 文件')">📖 读内存</button>
                    <button class="quick-btn" onclick="sendQuick('帮我写一个 Python Hello World')">🐍 写代码</button>
                </div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                    <button class="btn-send" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let clientId = null;
        let connectedUserId = null;

        function getStatus() {
            return document.getElementById('status');
        }

        function getConnectBtn() {
            return document.getElementById('connectBtn');
        }

        function getDisconnectBtn() {
            return document.getElementById('disconnectBtn');
        }

        function getMessages() {
            return document.getElementById('messages');
        }

        function getLogs() {
            return document.getElementById('logs');
        }

        function getMessageInput() {
            return document.getElementById('messageInput');
        }

        function log(type, message) {
            const logs = getLogs();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="time">[${time}]</span> ${escapeHtml(message)}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        let streamingMessage = null;

        function addMessage(type, content, extra = {}) {
            const messages = getMessages();
            const msg = document.createElement('div');
            msg.className = `message ${type}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            // 简单的 Markdown 处理
            let html = content
                .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');

            bubble.innerHTML = html;
            msg.appendChild(bubble);
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        function updateStreamingMessage(content, done) {
            const messages = getMessages();

            if (!streamingMessage) {
                // Create new streaming message
                streamingMessage = document.createElement('div');
                streamingMessage.className = 'message assistant streaming';
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = content;
                streamingMessage.appendChild(bubble);
                messages.appendChild(streamingMessage);
            } else {
                // Update existing streaming message
                const bubble = streamingMessage.querySelector('.bubble');
                bubble.textContent = content;
            }

            messages.scrollTop = messages.scrollHeight;

            if (done) {
                streamingMessage.classList.remove('streaming');
                streamingMessage = null;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStatus(status) {
            const statusEl = getStatus();
            statusEl.className = `status ${status}`;
            const statusText = {
                'connected': '已连接',
                'disconnected': '未连接',
                'connecting': '连接中...'
            };
            statusEl.textContent = statusText[status] || status;

            getConnectBtn().style.display = status === 'connected' ? 'none' : 'inline-block';
            getDisconnectBtn().style.display = status === 'connected' ? 'inline-block' : 'none';
        }

        function connect() {
            const host = document.getElementById('host').value || 'localhost';
            const port = document.getElementById('port').value || '8765';
            const userId = document.getElementById('userId').value;
            const token = document.getElementById('token').value;

            if (!userId) {
                alert('请输入用户ID');
                return;
            }

            const wsUrl = `ws://${host}:${port}`;
            log('info', `正在连接到 ${wsUrl}...`);
            updateStatus('connecting');

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = function() {
                    log('info', 'WebSocket 连接已建立，正在认证...');
                    // 发送认证消息
                    const authMsg = {
                        type: 'auth',
                        user_id: userId
                    };
                    if (token) {
                        authMsg.token = token;
                    }
                    ws.send(JSON.stringify(authMsg));
                    log('sent', JSON.stringify(authMsg));
                };

                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    log('received', `收到: ${data.type}`);

                    switch (data.type) {
                        case 'connected':
                            clientId = data.client_id;
                            connectedUserId = data.user_id;
                            updateStatus('connected');
                            log('info', `认证成功！客户端ID: ${clientId}, 用户ID: ${connectedUserId}`);
                            addMessage('system', `已连接为用户: ${connectedUserId}`);
                            sendPreferences();
                            break;

                        case 'message':
                            if (data.streaming) {
                                // Streaming message - update or create
                                updateStreamingMessage(data.content, data.done);
                            } else {
                                addMessage('assistant', data.content);
                            }
                            break;

                        case 'thinking':
                            if (document.getElementById('showThinking').checked) {
                                addMessage('thinking', data.content);
                            }
                            break;

                        case 'tool_call':
                            const toolCallText = `🔧 执行工具: ${data.tool_name}`;
                            addMessage('tool_call', toolCallText, { tool_name: data.tool_name });
                            break;

                        case 'tool_result':
                            const resultText = data.success
                                ? `✓ 工具完成: ${data.tool_name}`
                                : `✗ 工具失败: ${data.tool_name}`;
                            addMessage('tool_result', resultText + '\n' + data.content);
                            break;

                        case 'pong':
                            log('info', '心跳响应');
                            break;

                        case 'error':
                            log('error', `错误: ${data.message}`);
                            addMessage('error', data.message);
                            break;

                        case 'preferences_ack':
                            log('info', `偏好设置已确认: ${JSON.stringify(data.preferences)}`);
                            break;

                        default:
                            log('info', `未知消息类型: ${data.type}`);
                            addMessage('system', `[未知类型: ${data.type}] ${data.content}`);
                    }
                };

                ws.onerror = function(error) {
                    log('error', 'WebSocket 错误');
                    console.error('WebSocket error:', error);
                };

                ws.onclose = function(event) {
                    updateStatus('disconnected');
                    log('info', `连接已关闭 (code: ${event.code})`);
                    addMessage('system', '连接已断开');
                    ws = null;
                };

            } catch (error) {
                log('error', `连接失败: ${error.message}`);
                updateStatus('disconnected');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function sendMessage() {
            const input = getMessageInput();
            const content = input.value.trim();

            if (!content) {
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('请先连接服务器');
                return;
            }

            const msg = {
                type: 'message',
                content: content
            };

            ws.send(JSON.stringify(msg));
            log('sent', content);
            addMessage('user', content);
            input.value = '';
        }

        function sendQuick(text) {
            getMessageInput().value = text;
            sendMessage();
        }

        function sendPreferences() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }
            const prefs = {
                type: 'preferences',
                show_thinking: document.getElementById('showThinking').checked
            };
            ws.send(JSON.stringify(prefs));
            log('sent', `Preferences: show_thinking=${prefs.show_thinking}`);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 定期发送心跳
        setInterval(function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);
    </script>
</body>
</html>
